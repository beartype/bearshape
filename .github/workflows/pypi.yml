name: Validate or publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to validate; publication requires v<project-version>
        required: true
        type: string
      publish:
        description: Publish validated artifacts to PyPI after environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pypi-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          python-version: "3.14"
      - name: Resolve and validate release identity
        id: identity
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
        run: |
          PROJECT_VERSION="$(uv version --short)" uv run --locked --only-group dev python tools/check_release.py

  validate:
    needs: resolve
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  contract:
    name: Full composition release contract (${{ matrix.python }})
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: dist/
      - name: Install exact candidate with the locked test dependencies
        run: |
          uv sync --locked --no-default-groups --group optional --group test
          uv pip install --no-deps --reinstall dist/*.whl
      - name: Require full native union semantics from the installed wheel
        run: |
          .venv/bin/python -I -m pytest tools/upstream/ -n 0
          .venv/bin/python -I tools/probe_union.py

  evidence:
    needs: [resolve, validate, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: dist/
      - name: Record validated artifact identity
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          PROJECT_VERSION: ${{ needs.resolve.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          uv run --locked --only-group dev python tools/check_release_evidence.py
          record release-evidence.json dist
          --source-sha "$SOURCE_SHA" --version "$PROJECT_VERSION" --run-url "$RUN_URL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: release-evidence.json
          if-no-files-found: error

  publish:
    name: Publish validated artifacts to PyPI
    if: needs.resolve.outputs.publish == 'true'
    needs: [resolve, validate, contract, evidence]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bearshape
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: evidence/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source/
          persist-credentials: false
      - name: Verify approved bytes immediately before upload
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          PROJECT_VERSION: ${{ needs.resolve.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python source/tools/check_release_evidence.py
          verify evidence/release-evidence.json dist
          --source-sha "$SOURCE_SHA" --version "$PROJECT_VERSION" --run-url "$RUN_URL"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
