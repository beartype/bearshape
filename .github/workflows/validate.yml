name: Validate candidate

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate; defaults to the caller event SHA
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UV_TORCH_BACKEND: cpu

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
      - name: Verify installed hook stages
        run: |
          uv run --locked --only-group dev prek install
          test ! -e "$(git rev-parse --git-path hooks/commit-msg)"
          message_file="$(mktemp)"
          printf '%s\n' 'Hook stage validation' > "$message_file"
          uv run --locked --only-group dev prek run --stage commit-msg --commit-msg-filename "$message_file"
      - run: uv run --locked --only-group dev prek run -a
      - run: uv run --locked --only-group dev prek run actionlint -a --stage manual
      - run: git diff --exit-code

  runtime:
    name: Runtime (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group optional --group test
      - run: uv run --no-sync python tools/validate_runtime.py cpu
      - run: >-
          uv run --no-sync pytest tests/ --ignore=tests/test_typecheck.py -n 4
          --cov=bearshape --cov-branch --cov-report=term-missing:skip-covered
          --cov-report=json:build/coverage/coverage.json
          --cov-report=xml:build/coverage/coverage.xml
          --cov-report=html:build/coverage/htmlcov
          --cov-fail-under=90
      - name: Retain measured coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: build/coverage/
          if-no-files-found: warn
          retention-days: 7

  checkers:
    name: Four checkers (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group optional --group static --group test
      - run: uv run --no-sync python tools/validate_runtime.py type
      - run: uv run --no-sync pytest tests/test_typecheck.py -v

  compatibility:
    name: Compatibility (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - py311-bt0231-numpy22
          - py311-bt0231-jax05
          - py311-bt0231-torch26
          - py311-bt0231-optree014
          - py313-bt0231-numpy24
          - py313-bt0231-jax09
          - py313-bt0231-torch210
          - py313-bt0231-optree019
          - py313-bt0231-type-pyright1408
          - py313-bt0231-type-mypy119
          - py313-bt0231-type-ty
          - py313-bt0231-type-pyrefly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          enable-cache: true
      - run: uv run --locked --only-group test tox run -e "${{ matrix.environment }}"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
      - run: uv run --locked --only-group docs zensical build --clean
      - run: uv run --locked --only-group docs python tools/check_docs.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: docs-validation-pages
          path: site/
          retention-days: 1

  notebook:
    name: Tour notebook (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group optional --group notebook
      - run: uv run --no-sync python tools/validate_runtime.py cpu
      - run: uv run --no-sync python tools/check_notebook.py

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
      - run: uv build --sdist
      - run: uv build dist/*.tar.gz --wheel
      - run: uv run --locked --only-group dev python tools/check_distribution.py dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-distributions
          path: dist/
          if-no-files-found: error

  minimal:
    name: Minimal wheel (Python ${{ matrix.python }})
    needs: distributions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: dist/
      - run: uv venv --python "${{ matrix.python }}" .minimal
      - run: uv pip install --python .minimal/bin/python dist/*.whl "beartype==0.23.1"
      - run: .minimal/bin/python -I tools/smoke_minimal.py

  installed:
    name: Installed consumers (Python ${{ matrix.python }})
    needs: distributions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: dist/
      - run: >-
          uv run --locked --only-group dev python tools/check_installed.py
          dist/*.whl dist/*.tar.gz --python "${{ matrix.python }}"

  required:
    name: Required validation
    if: always()
    needs:
      [
        quality,
        runtime,
        checkers,
        compatibility,
        docs,
        notebook,
        distributions,
        minimal,
        installed,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required validation did not succeed: {failed}")
          print("All required validation jobs succeeded")
          PY
