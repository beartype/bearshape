name: Validate local upstream proposal

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/upstream-proposal.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  proposal:
    name: Proposal (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bearshape
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: beartype/beartype
          ref: f85b67d8b0b6bd9c910bd97f0d2d417c4550b038
          path: upstream
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python }}
      - name: Build and test normally installed proposal wheels
        working-directory: bearshape
        env:
          PROPOSAL_PYTHON: ${{ matrix.python }}
        run: |
          uv run --locked --only-group dev python tools/check_upstream_proposal.py \
            --upstream-source ../upstream --output ../proposal-evidence \
            --python "$PROPOSAL_PYTHON"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-proposal-${{ matrix.python }}
          path: |
            proposal-evidence/commands.json
            proposal-evidence/evidence.json
            proposal-evidence/dist/
